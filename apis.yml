name: Home24
description: >-
  Home24 is a leading pure-play home & living e-commerce retailer in Continental
  Europe, founded in Berlin in 2009. It operates across Germany, France, Austria,
  the Netherlands, Switzerland, Belgium and Italy, selling furniture and home
  accessories through home24.de and its sister storefronts with a catalog of more
  than 250,000 products, alongside its own private labels and logistics network.
  Since April 2023 Home24 SE has been part of the Austrian XXXLutz Group, and it
  was delisted from the Frankfurt Stock Exchange in September 2023. Home24
  publishes no public developer API or OpenAPI definition; its programmatic
  surfaces are a partner/affiliate marketing program and marketplace seller
  integrations used to syndicate product-data feeds, plus a public engineering
  blog. This profile was enriched by the API Evangelist pipeline; the API-artifact
  facets are not applicable because there is no public API surface to harvest.
